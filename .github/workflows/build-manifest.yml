name: Update All Tests list

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/build-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build tests.json and sitemap.xml from tests/*/test.json
        run: node scripts/build-manifest.mjs

      - name: Commit tests.json if it changed
        id: commit
        run: |
          if git diff --quiet -- tests.json sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tests.json already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests.json sitemap.xml
            git commit -m "Update All Tests list"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with GITHUB_TOKEN may not start a Pages build on their own, so request one.
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
