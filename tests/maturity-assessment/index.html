<script>
(function(){

/* ---------------------------------------------------------------
   DIMENSIONS (10, matching the brief exactly)
----------------------------------------------------------------*/
const DIMENSIONS = [
  { key: "EC",   name: "Emotional Control" },
  { key: "ACC",  name: "Accountability" },
  { key: "SA",   name: "Self-Awareness" },
  { key: "CH",   name: "Handling Conflict" },
  { key: "REL",  name: "Relationships" },
  { key: "DM",   name: "Decision-Making" },
  { key: "PAT",  name: "Patience" },
  { key: "EMP",  name: "Empathy" },
  { key: "RESP", name: "Responsibility" },
  { key: "LT",   name: "Long-Term Thinking" }
];

/* Each option carries a score map (1-5 per dimension it touches).
   All four options in a question are written to sound reasonable —
   nothing is labeled as the "right" choice. */
const QUESTION_BANK = [
{ id: 1, text: "You and a good friend had an argument. Later, you think some of what they said was unfair. But some of it might be true too. What would you most likely do?",
  options: [

      if (sc !== undefined) related.push({ q, opt, sc, t: times[i] || 0 });
    });
    const lows = related.filter(r => r.sc <= 2).length;
    const summary = lows
      ? "Out of " + related.length + " situations in your test that touched on " + d.name.toLowerCase() + ", " + lows + " of your choices leaned toward " + leanPhrase(d.key, false) + "."
      : "In the " + related.length + " situations that touched on " + d.name.toLowerCase() + ", most of your choices were middle-ground rather than clearly strong, which is why this area scored below the rest.";
    const evidence = related.filter(r => r.sc <= 3).sort((a, b) => a.sc - b.sc || a.t - b.t).slice(0, 2).map(r => {
      let s = "In the situation \"" + situationShort(r.q.text) + "\", you chose: \"" + r.opt.text + "\"";
      if (r.t > 0 && r.t <= Math.max(5, med * 0.5)) s += " You answered this in " + formatLong(r.t) + ", which suggests it is an instinctive reaction for you.";
      return s;
    });
    items.push({ kind: "weak", dim: d, summary, evidence });
  });
  sorted.slice(0, 2).forEach(d => {
    let best = null;
    QUESTIONS.forEach((q, i) => {
      if (answers[i] === null) return;
      const opt = q.options[answers[i]], sc = opt.scores[d.key];
      if (sc !== undefined && sc >= 4 && (!best || sc > best.sc)) best = { q, opt, sc };
    });
    if (best) items.push({ kind: "strong", dim: d, summary: "", evidence: ["In the situation \"" + situationShort(best.q.text) + "\", you chose: \"" + best.opt.text + "\" This shows " + leanPhrase(d.key, true) + "."] });
  });
  return items;
}
function insightsHtml(items){
  const weak = items.filter(i => i.kind === "weak"), strong = items.filter(i => i.kind === "strong");
  return weak.map(it => `
    <div class="callout low" style="margin-bottom:18px;">
      <h4 class="serif">${it.dim.name} (${it.dim.score}/100)</h4>

    </div>` : ``);
}

// While "Download both" runs, PDFs are collected here instead of being saved one by one
let pdfCollector = null;
async function savePdfDoc(doc, filename){
  const blob = doc.output("blob");
  if (pdfCollector) { pdfCollector.push({ filename: filename, blob: blob }); return; }
  await saveBlob(blob, filename);
}
async function saveBlob(blob, filename){
  let saved = false;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const downloads = await window.claude.use("downloads");
      if (downloads) {
        const result = await downloads.save({ filename: filename, data: blob });
        saved = result && (result.status === "saved" || result.status === "delivered");
      }
    }
  } catch (e) { saved = false; }
  if (!saved) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
}

// Both PDFs in one ZIP (one download works everywhere, unlike two downloads in a row)
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + src + '"]')) return resolve();
    const el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
async function downloadBothZip(){
  const statusEl = document.getElementById("both-status");
  const btn = document.getElementById("both-btn");
  btn.disabled = true;
  statusEl.textContent = "Building both documents...";
  try {
    if (!window.JSZip) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    pdfCollector = [];
    await downloadPdf();
    await downloadPlanPdf();
    const files = pdfCollector;
    pdfCollector = null;
    if (files.length !== 2) throw new Error("missing pdf");
    const zip = new JSZip();
    files.forEach(f => zip.file(f.filename, f.blob));
    const blob = await zip.generateAsync({ type: "blob" });
    await saveBlob(blob, "HV_Test_Maturity_Assessment_" + sanitizeFilenamePart(userInfo.name) + ".zip");
    statusEl.textContent = "Both documents are in one ZIP file.";
  } catch (e) {
    statusEl.textContent = "Couldn't build the ZIP. Please use the two buttons below.";
  } finally {
    pdfCollector = null;
    btn.disabled = false;
    document.getElementById("pdf-status").textContent = "";
    document.getElementById("plan-status").textContent = "";
  }
}

  EMP: { high: "This leans toward noticing and considering how others feel.", low: "This leans toward other people's feelings registering a bit later." },
  RESP:{ high: "This leans toward following through on what you said.", low: "This leans toward commitments slipping when things get hard." },
  LT:  { high: "This leans toward thinking about where a choice leads.", low: "This leans toward the present moment mattering most." }
};
function insightFor(scores){
  let bestKey = null, bestVal = -1;
  Object.keys(scores).forEach(k => { if (scores[k] > bestVal) { bestVal = scores[k]; bestKey = k; } });
  if (!bestKey) return "This answer is a fairly balanced choice, without a strong lean either way.";
  const dimName = DIM_COPY[bestKey].name;
  if (bestVal >= 4) return "<strong>" + dimName + ".</strong> " + INSIGHT[bestKey].high;
  if (bestVal <= 2) return "<strong>" + dimName + ".</strong> " + INSIGHT[bestKey].low;
  return "<strong>" + dimName + ".</strong> This is a fairly balanced choice on this point.";
}

----------------------------------------------------------------*/

}

/* ---------------------------------------------------------------
   RANDOMIZED ASSESSMENT GENERATION
   Selects ~28-30 questions from the larger QUESTION_BANK for this
   attempt, with balanced coverage across all 10 dimensions, then
   shuffles both question order and each question's option order.
   The set is frozen for the whole attempt once generated.
----------------------------------------------------------------*/
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function questionDimSet(q){
  const set = new Set();
  q.options.forEach(o => Object.keys(o.scores).forEach(k => set.add(k)));
  return set;
}
function generateAssessment(){
  const TARGET = 28 + Math.floor(Math.random() * 3); // 28, 29, or 30
  const MIN_PER_DIM = 2;

  let pool = QUESTION_BANK.filter(q => !recentAttemptIds.includes(q.id));
  if (pool.length < TARGET) pool = QUESTION_BANK.slice();
  pool = shuffleArray(pool);

  const selectedIds = new Set();
  const selected = [];
  const dimCount = {};
  DIMENSIONS.forEach(d => { dimCount[d.key] = 0; });

  const dimOrder = shuffleArray(DIMENSIONS.map(d => d.key));
  dimOrder.forEach(dimKey => {
    let guard = 0;
    while (dimCount[dimKey] < MIN_PER_DIM && selected.length < TARGET && guard < pool.length) {
      const candidate = pool.find(q => !selectedIds.has(q.id) && questionDimSet(q).has(dimKey));
      guard++;
      if (!candidate) break;
      selectedIds.add(candidate.id);
      selected.push(candidate);
      questionDimSet(candidate).forEach(k => { dimCount[k]++; });
    }
  });

  for (let i = 0; i < pool.length && selected.length < TARGET; i++) {
    const q = pool[i];
    if (!selectedIds.has(q.id)) {
      selectedIds.add(q.id);
      selected.push(q);
      questionDimSet(q).forEach(k => { dimCount[k]++; });
    }
  }

  const finalOrder = shuffleArray(selected).slice(0, TARGET);
  const attemptQuestions = finalOrder.map(q => ({
    id: q.id,
    text: q.text,
    options: shuffleArray(q.options)
  }));

  recentAttemptIds = attemptQuestions.map(q => q.id);

  QUESTIONS = attemptQuestions;
  answers = new Array(QUESTIONS.length).fill(null);
  times = new Array(QUESTIONS.length).fill(null);
  timerQuestionIndex = -1;
  questionStartTs = null;
  current = 0;
}

/* ---------------------------------------------------------------
   RESPONSE TIME TRACKING
   A small, secondary authenticity signal — never the primary score.
----------------------------------------------------------------*/
function recordTime(idx){
  if (timerQuestionIndex === idx && questionStartTs !== null) {
    times[idx] = (Date.now() - questionStartTs) / 1000;
  }
}
function medianOf(arr){
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1] + s[mid]) / 2;
}
function analyzeResponseTimes(){
  const valid = times.filter(t => typeof t === "number" && !isNaN(t) && t >= 0);
  const n = valid.length;
  if (n === 0) {
    return { total:0, average:0, median:0, fastest:0, longest:0, longCount:0, longProportion:0, adjustment:0,
      interpretation: "Not enough timing data was captured to look at your answer pattern." };
  }
  const total = valid.reduce((a,b)=>a+b, 0);
  const average = total / n;
  const med = medianOf(valid);
  const fastest = Math.min(...valid);
  const longest = Math.max(...valid);
  const threshold = Math.max(45, med * 2.5);
  const longCount = valid.filter(t => t > threshold).length;
  const longProportion = longCount / n;

  let adjustment = 0, interpretation = "";
  if (longProportion < 0.15) {
    adjustment = 0;
    interpretation = "Your answers were generally quick and steady across the test, which may suggest you relied mostly on your natural, in-the-moment reactions. This has not affected your score.";
  } else if (longProportion < 0.35) {
    adjustment = -1;
    interpretation = "Most of your answers came at a fairly natural pace, though a handful of questions took noticeably longer to answer. This is common, and it's had only a very small effect on your final score.";
  } else if (longProportion < 0.55) {
    adjustment = -3;
    interpretation = "You spent considerably more time than usual on several questions. This may suggest you were carefully weighing which answer seemed most appropriate, rather than answering right away. Because this test is designed to capture natural responses, this pattern has been considered as a small factor in your overall score.";
  } else {
    adjustment = -5;
    interpretation = "You spent a notably long time on a large number of questions. This often reflects careful, deliberate thinking — though it can also reflect trying to work out which answer seems best. Because this test is designed to capture natural responses, this pattern has been factored into your overall score as a limited, small adjustment.";
  }
  return { total, average, median: med, fastest, longest, longCount, longProportion, adjustment, interpretation, n };
}
function formatShort(seconds){
  const s = Math.round(seconds || 0);
  if (s < 60) return s + " sec";
  const m = Math.floor(s / 60), r = s % 60;
  return m + " min " + r + " sec";
}
function formatLong(seconds){
  const s = Math.round(seconds || 0);
  if (s < 60) return s + (s === 1 ? " second" : " seconds");
  const m = Math.floor(s / 60), r = s % 60;
  const mPart = m + (m === 1 ? " minute" : " minutes");
  if (r === 0) return mPart;
  return mPart + " " + r + (r === 1 ? " second" : " seconds");
}

function computeResults(){
  const totals = {}, counts = {};
  DIMENSIONS.forEach(d => { totals[d.key]=0; counts[d.key]=0; });
  answers.forEach((optIdx, qIdx) => {
    if (optIdx === null) return;
    const scores = QUESTIONS[qIdx].options[optIdx].scores;
    Object.keys(scores).forEach(k => { totals[k] += scores[k]; counts[k] += 1; });
  });
  const dimScores = {};
  DIMENSIONS.forEach(d => {
    if (counts[d.key] > 0) {
      const avg = totals[d.key] / counts[d.key];
      dimScores[d.key] = Math.round(((avg - 1) / 4) * 100);
    } else {
      dimScores[d.key] = 50;
    }
  });
  const baseOverall = Math.round(DIMENSIONS.reduce((s,d) => s + dimScores[d.key], 0) / DIMENSIONS.length);
  const timeStats = analyzeResponseTimes();
  const overall = Math.max(0, Math.min(100, baseOverall + timeStats.adjustment));
  return { dimScores, overall, baseOverall, timeStats };
}
function tierFor(score){ return TIERS.find(t => score <= t.max); }
function tierText(copy, score){
  if (score >= 70) return copy.high;
  if (score >= 40) return copy.mid;
  return copy.low;
}
function tierNarrative(overall){
  if (overall > 85) return "Across very different kinds of situations — money, family, conflict, failure — your answers point in a consistent direction. That's a meaningful signal: it's hard to fake steadiness across " + QUESTIONS.length + " unrelated situations.";
  if (overall > 65) return "Most of your answers show steady, thought-through patterns, with a smaller set of situations where the answer leans toward what's comfortable or immediate rather than what holds up over time. That's a normal, workable mix.";
  if (overall > 40) return "Your answers show real strength in some areas, alongside patterns that are still forming in others — often in situations involving direct conflict, waiting things out, or sitting with an uncomfortable feeling before reacting to it.";
  return "Your answers suggest that immediate comfort, avoidance, or reaction tends to come first fairly often. That's common, and it's specific — the breakdown below points to exactly where to start.";
}

function personalProfileLines(dimScores){

}

// Outfit (the HV TEST wordmark font) for PDFs, loaded once from the site; falls back to Helvetica
let brandFontData = null;
async function useBrandFont(doc){
  if (brandFontData === null) {
    try {
      const load = async file => {
        const res = await fetch("../../assets/fonts/" + file);
        if (!res.ok) throw new Error(res.status);
        const bytes = new Uint8Array(await res.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(bin);
      };
      brandFontData = { bold: await load("Outfit-Bold.ttf"), semibold: await load("Outfit-SemiBold.ttf") };
    } catch (e) { brandFontData = false; }
  }
  if (!brandFontData) return;
  doc.addFileToVFS("Outfit-Bold.ttf", brandFontData.bold); doc.addFont("Outfit-Bold.ttf", "Outfit", "bold");
  doc.addFileToVFS("Outfit-SemiBold.ttf", brandFontData.semibold); doc.addFont("Outfit-SemiBold.ttf", "Outfit", "semibold");
  doc.hvBrandFont = true;
}
function brandFont(doc, weight){
  if (doc.hvBrandFont) doc.setFont("Outfit", weight); else doc.setFont("helvetica", "bold");
}

    if (current > 0) { recordTime(current); current--; render(); }
  });
  document.getElementById("next-btn").addEventListener("click", () => {
    if (answers[current] === null) return;
    recordTime(current);
    if (current === QUESTIONS.length - 1) { screen = "confirm"; render(); }
    else { current++; render(); }
  });
}

----------------------------------------------------------------*/
async function downloadPdf(){
  const statusEl = document.getElementById("pdf-status");
  const btn = document.getElementById("pdf-btn");
  if (!window.jspdf || !window.jspdf.jsPDF) {
    statusEl.textContent = "The PDF tool didn't load. Please check your connection and try again.";
    return;
  }
  btn.disabled = true;
  statusEl.textContent = "Building your report…";

  try {
    const { dimScores, overall, baseOverall, timeStats } = computeResults();
    const tier = tierFor(overall);
    const sorted = DIMENSIONS.map(d => ({...d, score: dimScores[d.key]})).sort((a,b) => b.score - a.score);
    const strengths = sorted.slice(0,3);
    const growth = sorted.slice(-3).reverse();
    const firstName = firstNameOf(userInfo.name);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    await useBrandFont(doc);
    const pageW = 210, pageH = 297;
    const marginX = 20;
    const contentW = pageW - marginX * 2;
    let y = 0;

    const inkColor = [23,35,28];
    const softColor = [74,90,80];
    const faintColor = [111,129,119];
    const accentColor = [18,122,79];
    const lineColor = [220,231,223];

    function newPage(){ doc.addPage(); y = 24; }
    function ensure(space){ if (y + space > pageH - 20) newPage(); }
    function hr(){
      ensure(6);
      doc.setDrawColor.apply(doc, lineColor);
      doc.line(marginX, y, pageW - marginX, y);
      y += 8;
    }
    function heading(text, size){
      ensure(size/2 + 6);
      doc.setFont("times", "normal");
      doc.setFontSize(size);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(text, marginX, y);
      y += size * 0.6;
    }
    function label(text){
      ensure(8);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor.apply(doc, faintColor);
      doc.text(text.toUpperCase(), marginX, y);
      y += 6;
    }
    function body(text, opts){
      opts = opts || {};
      doc.setFont("helvetica", "normal");
      doc.setFontSize(opts.size || 10.5);
      doc.setTextColor.apply(doc, opts.color || softColor);
      const lines = doc.splitTextToSize(text, opts.width || contentW);
      lines.forEach(line => {
        ensure(6);
        doc.text(line, marginX, y);
        y += (opts.lineH || 5.2);
      });
      y += (opts.after !== undefined ? opts.after : 2);
    }
    function barRow(name, score, explain){
      ensure(18);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(name, marginX, y);
      doc.setFont("helvetica", "normal");
      doc.setTextColor.apply(doc, faintColor);
      doc.text(score + "/100", pageW - marginX, y, { align: "right" });
      y += 4;
      const barW = contentW;
      doc.setFillColor(220,231,223);
      doc.rect(marginX, y, barW, 2.2, "F");
      doc.setFillColor.apply(doc, accentColor);
      doc.rect(marginX, y, barW * (score/100), 2.2, "F");
      y += 6;
      body(explain, { size: 9.5, after: 6 });
    }

    // ---- Cover / header ----
    y = 26;
    drawCoverBrand(doc, marginX, y, pageW - marginX, "MATURITY ASSESSMENT  |  REPORT");
    y += 10;
    doc.setFont("times", "normal");
    doc.setFontSize(22);
    doc.setTextColor.apply(doc, inkColor);
    const titleLines = doc.splitTextToSize(userInfo.name + "'s Maturity Assessment", contentW);
    titleLines.forEach(line => { doc.text(line, marginX, y); y += 8.5; });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(12.5);
    doc.setTextColor.apply(doc, softColor);
    doc.text("Personal Growth & Self-Awareness Report", marginX, y);
    y += 10;
    hr();

    label("Personal Information");
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    doc.setTextColor.apply(doc, inkColor);
    const dateStr = assessmentDateTimeText();
    [
      ["Name", userInfo.name],
      ["Age", String(userInfo.age)],
      ["Profession", professionLabel()],
      ["Date of assessment", dateStr]
    ].forEach(row => {
      ensure(6);
      doc.setFont("helvetica", "bold");
      doc.setTextColor.apply(doc, faintColor);
      doc.text(row[0] + ":", marginX, y);
      doc.setFont("helvetica", "normal");
      doc.setTextColor.apply(doc, inkColor);
      doc.text(row[1], marginX + 42, y);
      y += 6;
    });
    y += 4;
    hr();

    label("Overall Maturity Score");
    doc.setFont("times", "normal");
    doc.setFontSize(40);
    doc.setTextColor.apply(doc, inkColor);
    doc.text(String(overall) + " / 100", marginX, y + 12);
    y += 18;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor.apply(doc, accentColor);
    doc.text(tier.label, marginX, y);
    y += 6;
    body(tier.blurb, { after: 6 });
    body(tierNarrative(overall), { after: 4 });
    if (timeStats.adjustment !== 0) {
      body("Note: your answer-based score was " + baseOverall + "/100. A small adjustment of " + timeStats.adjustment + " point(s) was applied based on your response-time pattern — see " + firstName + "'s Response Pattern below.", { size: 9, color: faintColor, after: 4 });
    }

    hr();
    label(firstName + "'s Maturity Dimensions");
    DIMENSIONS.forEach(d => {
      barRow(d.name, dimScores[d.key], tierText(DIM_COPY[d.key], dimScores[d.key]));
    });

    hr();
    label("Your Strongest Areas");
    strengths.forEach(d => {
      ensure(14);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(d.name + " — " + d.score + "/100", marginX, y);
      y += 5.5;
      body(tierText(DIM_COPY[d.key], d.score), { size: 9.5, after: 5 });
    });

    hr();
    label("Areas That May Need Some Work");
    growth.forEach(d => {
      ensure(14);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(d.name + " — " + d.score + "/100", marginX, y);
      y += 5.5;
      body(tierText(DIM_COPY[d.key], d.score), { size: 9.5, after: 5 });
    });

    hr();
    label("Your Age, In Context");
    body(ageContextText(userInfo, sorted), { size: 10, after: 4 });

    hr();
    label("Your Profession, In Context");
    body(professionContextText(userInfo, sorted), { size: 10, after: 4 });

    hr();
    label("Practical Suggestions");
    growth.forEach(d => {
      body("• " + d.name + ": " + SUGGESTIONS[d.key], { size: 9.5, after: 4 });
    });

    body("Your detailed 30-day plan, built from your own answers, is in a separate document: " + firstName + "'s Plan of Action. Download it from the results page.", { size: 9.5, color: accentColor, after: 4 });

    // ---- Response Time Analysis ----
    newPage();
    heading(firstName + "'s Response Pattern", 16);
    y += 2;
    body("How long you spent thinking about each question, used only as a small, secondary signal alongside your actual answers — never as the main measure of your score.", { size: 10, after: 6 });
    hr();
    [
      ["Total Test Time", formatShort(timeStats.total)],
      ["Average Time per Question", formatShort(timeStats.average)],
      ["Median Time per Question", formatShort(timeStats.median)],
      ["Fastest Response", formatShort(timeStats.fastest)],
      ["Longest Response", formatShort(timeStats.longest)]
    ].forEach(row => {
      ensure(6);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10);
      doc.setTextColor.apply(doc, faintColor);
      doc.text(row[0] + ":", marginX, y);
      doc.setFont("helvetica", "normal");
      doc.setTextColor.apply(doc, inkColor);
      doc.text(row[1], marginX + 68, y);
      y += 6;
    });
    y += 4;
    body(timeStats.interpretation, { size: 10, after: 6 });
    if (timeStats.adjustment !== 0) {
      body("Score adjustment applied: " + timeStats.adjustment + " point(s) out of 100 — small by design, so it can never outweigh your actual answers.", { size: 9, color: faintColor, after: 4 });
    }

    hr();
    label("Question-By-Question Response Times");
    QUESTIONS.forEach((q, i) => {
      ensure(5.5);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor.apply(doc, softColor);
      doc.text("Question " + (i+1), marginX, y);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(formatLong(times[i]), marginX + 40, y);
      y += 5;
    });

    // ---- Personal Maturity Profile ----
    newPage();
    heading("Your Personal Maturity Profile", 16);
    y += 2;
    body(userInfo.name + ", age " + userInfo.age + ", " + professionLabel() + " — overall score " + overall + "/100 (" + tier.label + "). This section combines your answers across all " + QUESTIONS.length + " situations into one picture. It is a self-assessment, not a medical or professional psychological evaluation.", { size: 10, after: 6 });
    hr();
    personalProfileLines(dimScores).forEach(row => {
      ensure(14);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor.apply(doc, inkColor);
      doc.text(row.label, marginX, y);
      y += 5.5;
      body(row.text, { size: 9.5, after: 5 });
    });
    hr();
    label("Strongest Maturity Patterns");
    body(strengths.map(d => d.name).join(", ") + ". " + strengths.map(d => tierText(DIM_COPY[d.key], d.score)).join(" "), { size: 9.5, after: 5 });
    label("Potential Blind Spots");
    body(growth.map(d => d.name).join(", ") + ". " + growth.map(d => tierText(DIM_COPY[d.key], d.score)).join(" "), { size: 9.5, after: 5 });

    // ---- Final profile summary ----
    newPage();
    heading(firstName + "'s Overall Profile", 16);
    y += 2;
    body("Overall score: " + overall + "/100 — " + tier.label + ".", { size: 10.5, after: 4 });
    body(tier.blurb + " " + tierNarrative(overall), { size: 10.5, after: 6 });
    hr();

    // ---- Full Q&A review ----
    label("Complete Question and Answer Review");
    y += 1;
    QUESTIONS.forEach((q, i) => {
      const optIdx = answers[i];
      const chosen = q.options[optIdx];
      ensure(30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor.apply(doc, faintColor);
      doc.text("QUESTION " + (i+1) + "   •   " + formatLong(times[i]), marginX, y);
      y += 5;
      doc.setFont("times", "normal");
      doc.setFontSize(11.5);
      doc.setTextColor.apply(doc, inkColor);
      const qLines = doc.splitTextToSize(q.text, contentW);
      qLines.forEach(line => { ensure(6); doc.text(line, marginX, y); y += 5.6; });
      y += 1;

      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor.apply(doc, faintColor);
      ensure(5);
      doc.text("YOUR ANSWER", marginX, y);
      y += 4.5;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor.apply(doc, inkColor);
      const aLines = doc.splitTextToSize(chosen.text, contentW - 4);
      aLines.forEach(line => { ensure(6); doc.text(line, marginX + 2, y); y += 5; });
      y += 1;

      const plain = insightFor(chosen.scores).replace(/<\/?strong>/g, "");
      body("What this choice may suggest: " + plain, { size: 9, color: softColor, after: 7 });
      ensure(2);
      doc.setDrawColor(238,244,239);
      doc.line(marginX, y, pageW - marginX, y);
      y += 7;
    });

    // ---- Footer note on last page ----
    ensure(20);
    y += 2;
    body("This report reflects self-reported answers to hypothetical situations, and is intended as a personal reflection tool, not a clinical or scientific assessment.", { size: 8.5, color: faintColor, after: 0 });

    // Footer — subtle brand line + page number on every page
    const pageCount = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pageCount; p++) {
      doc.setPage(p);
      doc.setDrawColor.apply(doc, lineColor);
      doc.setLineWidth(0.2);
      doc.line(marginX, pageH - 16, pageW - marginX, pageH - 16);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.setTextColor.apply(doc, faintColor);
      drawFooterBrand(doc, marginX, pageH - 11, "Maturity Assessment  |  " + firstName + "'s Report");
      doc.setTextColor.apply(doc, faintColor);
      doc.text("Page " + p + " of " + pageCount, pageW - marginX, pageH - 11, { align: "right" });
    }

    doc.setProperties({ title: "Maturity Assessment: Report for " + userInfo.name, subject: "HV Test | Maturity Assessment", author: "HV Test" });
    const filename = "HV_Test_Maturity_Assessment_Report_" + sanitizeFilenamePart(userInfo.name) + ".pdf";
    await savePdfDoc(doc, filename);

    statusEl.textContent = "Your report has been prepared.";
  } catch (err) {
    statusEl.textContent = "Something went wrong building the PDF. Please try again.";
  } finally {
    btn.disabled = false;
  }
}

render();
})();
</script>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle"), root = document.documentElement;
    function sync() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      btn.title = dark ? "Light mode" : "Dark mode";
    }
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      function apply() {
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("hv-theme", next); } catch (e) {}
        sync();
      }
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!document.startViewTransition || reduce) { apply(); return; }
      var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(apply).ready.then(function () {
        root.animate({ clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + end + "px at " + x + "px " + y + "px)"] },
          { duration: 500, easing: "cubic-bezier(.2,.7,.2,1)", pseudoElement: "::view-transition-new(root)" });
      }).catch(function () {});
    });
    sync();
  })();
</script>
