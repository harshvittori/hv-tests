<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HV Test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%233F5B4E%27/%3E%3Cpath d=%27M5.5%207v10M10.5%207v10M5.5%2012h5M13%207l3%2010%203-10%27 stroke=%27white%27 stroke-width=%271.9%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="Self-assessment tests by HV Test. Understand yourself. See your patterns. Grow from them.">
<style>
  :root {
    --paper: #F8F7F2;
    --paper-raised: #F0EEE7;
    --card: #FFFFFF;
    --ink: #2A2B26;
    --ink-soft: #5E5E55;
    --ink-faint: #8F8E83;
    --line: #E4E0D5;
    --accent: #3F5B4E;
    --accent-soft: #E9EEE7;
    --accent-ink: #24362D;
    --primary-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191A16;
      --paper-raised: #212319;
      --card: #1E1F1A;
      --ink: #EAE8DE;
      --ink-soft: #B4B2A4;
      --ink-faint: #757468;
      --line: #34362B;
      --accent: #8FB89E;
      --accent-soft: #26332A;
      --accent-ink: #C9E2D2;
      --primary-text: #14170F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #191A16;
    --paper-raised: #212319;
    --card: #1E1F1A;
    --ink: #EAE8DE;
    --ink-soft: #B4B2A4;
    --ink-faint: #757468;
    --line: #34362B;
    --accent: #8FB89E;
    --accent-soft: #26332A;
    --accent-ink: #C9E2D2;
    --primary-text: #14170F;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
  main {
    max-width: 880px; margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(80px + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width: 480px) { main { padding-left: 16px; padding-right: 16px; padding-top: 32px; } }

  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; color: var(--ink-soft); }
  .brand-word { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; }
  .brand-sep, .brand-sub { font-size: 12px; color: var(--ink-faint); }

  h1 { font-size: 36px; line-height: 1.18; margin: 0 0 16px; font-weight: 400; }
  @media (max-width: 480px) { h1 { font-size: 28px; } }
  .lede { font-size: 18px; color: var(--ink-soft); max-width: 52ch; margin: 0 0 12px; }
  .note { font-size: 13.5px; color: var(--ink-faint); margin: 0 0 40px; max-width: 56ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px; color: inherit; text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  a.card { box-shadow: 0 1px 2px rgba(40, 42, 35, 0.04); }
  a.card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(40, 42, 35, 0.07); }
  a.card:active { transform: translateY(1px); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.soon { opacity: 0.65; }

  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .chip {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink);
  }
  .chip.muted { background: var(--paper-raised); color: var(--ink-faint); }
  .card-num { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 22px; line-height: 1.25; font-weight: 500; margin: 0; }
  .tagline { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .desc { margin: 0; color: var(--ink-faint); font-size: 14px; }
  .outputs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .outputs li { font-size: 12px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .card-foot {
    margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; color: var(--ink-faint);
  }
  .cta { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }

  .state { color: var(--ink-faint); font-size: 15px; padding: 24px 0; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-faint); }
</style>
</head>
<body>
<main>
  <div class="brand-row">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <rect width="24" height="24" rx="6" style="fill:var(--accent)"/>
      <path d="M5.5 7v10M10.5 7v10M5.5 12h5M13 7l3 10 3-10" style="stroke:var(--primary-text)" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-word">HV TEST</span>
  </div>

  <h1 class="serif">All Tests</h1>
  <p class="lede">Understand yourself. See your patterns. Grow from them.</p>
  <p class="note">Every test runs in your browser. No login, and your answers are never stored or sent anywhere.</p>

  <section class="grid" id="tests" aria-live="polite">
    <p class="state">Loading tests...</p>
  </section>
  <noscript><p class="state">Please turn on JavaScript to see the tests.</p></noscript>

  <footer>HV TEST · Self-assessment tools for personal growth, not clinical or psychological diagnosis.</footer>
</main>

<script>
(function () {
  var list = document.getElementById("tests");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function metaLine(t) {
    var parts = [];
    if (t.questions) parts.push(t.questions + " questions");
    if (t.minutes) parts.push("about " + t.minutes + " min");
    return parts.join(" · ");
  }

  function card(t, i) {
    var live = t.status === "live";
    var num = String(i + 1).padStart(2, "0");
    var inner =
      '<div class="card-top">' +
        (live ? '<span class="chip">Live</span>' : '<span class="chip muted">Coming soon</span>') +
        '<span class="card-num">' + num + '</span>' +
      '</div>' +
      '<h2 class="serif">' + esc(t.title) + '</h2>' +
      (t.tagline ? '<p class="tagline">' + esc(t.tagline) + '</p>' : '') +
      (t.description ? '<p class="desc">' + esc(t.description) + '</p>' : '') +
      (t.outputs && t.outputs.length ? '<ul class="outputs">' + t.outputs.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join("") + '</ul>' : '') +
      '<div class="card-foot"><span>' + esc(metaLine(t)) + '</span>' +
        (live ? '<span class="cta">Start test &rarr;</span>' : '') +
      '</div>';
    return live
      ? '<a class="card" href="' + esc(t.url) + '">' + inner + '</a>'
      : '<div class="card soon" aria-disabled="true">' + inner + '</div>';
  }

  fetch("tests.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var tests = (data && data.tests) || [];
      list.innerHTML = tests.length
        ? tests.map(card).join("")
        : '<p class="state">New tests are on the way. Check back soon.</p>';
    })
    .catch(function () {
      list.innerHTML = '<p class="state">Could not load the list of tests. Please refresh the page.</p>';
    });
})();
</script>
</body>
</html>
