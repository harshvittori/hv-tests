<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Light by default; a saved choice from the toggle wins (shared by every HV Test page)
  (function () {
    var t = "light";
    try { t = localStorage.getItem("hv-theme") || "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2212%22 fill=%22%23127A4F%22/%3E%3Ccircle cx=%2216.5%22 cy=%2216.5%22 r=%225.5%22 stroke=%22%23FFFFFF%22 stroke-width=%223%22 fill=%22none%22/%3E%3Ccircle cx=%2231.5%22 cy=%2216.5%22 r=%225.5%22 stroke=%22%23FFFFFF%22 stroke-width=%223%22 fill=%22none%22/%3E%3Ccircle cx=%2216.5%22 cy=%2231.5%22 r=%225.5%22 stroke=%22%23FFFFFF%22 stroke-width=%223%22 fill=%22none%22/%3E%3Ccircle cx=%2231.5%22 cy=%2231.5%22 r=%227.5%22 fill=%22%23FFC54D%22/%3E%3Cpath d=%22M28 31.6l2.5 2.5 4.8-5%22 stroke=%22%2317231C%22 stroke-width=%222.6%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F7FAF7;
    --paper-raised: #EEF4EF;
    --ink: #17231C;
    --ink-soft: #4A5A50;
    --ink-faint: #6F8177;
    --line: #DCE7DF;
    --accent: #127A4F;
    --accent-soft: #E1F3E8;
    --accent-ink: #0B4F33;
    --warn: #A4552E;
    --spark: #F4A62A;
    --primary-text: #FFFFFF;
    --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F1512;
      --paper-raised: #16201B;
      --ink: #E6F0E9;
      --ink-soft: #A9BBAF;
      --ink-faint: #7C9084;
      --line: #25332B;
      --accent: #46C98B;
      --accent-soft: #143426;
      --accent-ink: #BDEFD4;
      --warn: #E09A6A;
      --spark: #F7B84B;
      --primary-text: #06140D;
      --card: #141C18;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F1512;
    --paper-raised: #16201B;
    --ink: #E6F0E9;
    --ink-soft: #A9BBAF;
    --ink-faint: #7C9084;
    --line: #25332B;
    --accent: #46C98B;
    --accent-soft: #143426;
    --accent-ink: #BDEFD4;
    --warn: #E09A6A;
    --spark: #F7B84B;
    --primary-text: #06140D;
    --card: #141C18;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
  main {
    max-width: 880px; margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(80px + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width: 480px) { main { padding-left: 16px; padding-right: 16px; padding-top: 32px; } }

  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; color: var(--ink-soft); }
  .brand-word { font-size: 12.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--ink); }
  .brand-sep, .brand-sub { font-size: 12px; color: var(--ink-faint); }

  h1 { font-size: 36px; line-height: 1.18; margin: 0 0 16px; font-weight: 400; }
  @media (max-width: 480px) { h1 { font-size: 28px; } }
  .lede { font-size: 18px; color: var(--ink-soft); max-width: 52ch; margin: 0 0 12px; }
  .lede strong { color: var(--accent); font-weight: 600; }
  h1::after { content: ""; display: block; width: 44px; height: 4px; border-radius: 99px; background: var(--spark); margin-top: 14px; }
  .note { font-size: 13.5px; color: var(--ink-faint); margin: 0 0 40px; max-width: 56ch; }

  .category { margin-bottom: 44px; }
  .category-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; }
  .category-head h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .category-head span { font-size: 13px; color: var(--ink-faint); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px; color: inherit; text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  a.card { box-shadow: 0 1px 2px rgba(18, 60, 40, 0.05); }
  a.card:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(18, 90, 60, 0.10); transform: translateY(-2px); }
  a.card:active { transform: translateY(1px); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.soon { opacity: 0.65; }

  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .chip {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink);
  }
  .chip::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
  .chip.muted::before { background: var(--ink-faint); }
  .chip.muted { background: var(--paper-raised); color: var(--ink-faint); }
  .card-num { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 22px; line-height: 1.25; font-weight: 500; margin: 0; }
  .tagline { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .desc { margin: 0; color: var(--ink-faint); font-size: 14px; }
  .outputs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .outputs li { font-size: 12px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .card-foot {
    margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; color: var(--ink-faint);
  }
  .cta { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }

  .state { color: var(--ink-faint); font-size: 15px; padding: 24px 0; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-faint); }
  .theme-toggle {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper-raised); color: var(--ink); border: 1px solid var(--line);
    cursor: pointer; padding: 0; transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* Theme switch: the new theme is revealed in a circle from the toggle (no colour cross-fade, so nothing turns grey or blinks) */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  .theme-toggle svg { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .theme-toggle:active svg { transform: rotate(40deg) scale(.9); }
  @keyframes hv-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes hv-fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }
  main > * { animation: hv-rise .5s cubic-bezier(.2,.7,.2,1) both; }
  main > *:nth-child(2) { animation-delay: .05s; }
  main > *:nth-child(3) { animation-delay: .1s; }
  main > *:nth-child(n+4) { animation-delay: .15s; }
  .category { animation: hv-rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .card { transition: border-color .25s ease, box-shadow .25s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
  .cta { transition: letter-spacing .25s ease; }
  a.card:hover .cta { letter-spacing: .02em; }

  /* HV Test wordmark: Outfit, rounded geometric to match the icon */
  .brand-word { font-family: "Outfit", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; font-size: 17px !important; font-weight: 700 !important; letter-spacing: 0.04em !important; color: var(--ink) !important; line-height: 1; }
  .brand-word .brand-accent { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Dark mode">
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
</button>
<main>
  <div class="brand-row">
    <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="12" fill="#127A4F"/><circle cx="16.5" cy="16.5" r="5.5" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="31.5" cy="16.5" r="5.5" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="16.5" cy="31.5" r="5.5" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="31.5" cy="31.5" r="7.5" fill="#FFC54D"/><path d="M28 31.6l2.5 2.5 4.8-5" stroke="#17231C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand-word">HV <span class="brand-accent">TEST</span></span>
  </div>

  <h1 class="serif">All Tests</h1>
  <p class="lede">Understand yourself. See your patterns. <strong>Grow from them.</strong></p>
  <p class="note">Every test runs in your browser. No login, and your answers are never stored or sent anywhere.</p>

  <div id="tests" aria-live="polite">
    <p class="state">Loading tests...</p>
  </div>
  <noscript><p class="state">Please turn on JavaScript to see the tests.</p></noscript>

  <footer>HV TEST · Self-assessment tools for personal growth, not clinical or psychological diagnosis.</footer>
</main>

<script>
(function () {
  var list = document.getElementById("tests");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function metaLine(t) {
    var parts = [];
    if (t.questions) parts.push(t.questions + " questions");
    if (t.minutes) parts.push("about " + t.minutes + " min");
    return parts.join(" · ");
  }

  function card(t, i) {
    var live = t.status === "live";
    var num = String(i + 1).padStart(2, "0");
    var inner =
      '<div class="card-top">' +
        (live ? '<span class="chip">Live</span>' : '<span class="chip muted">Coming soon</span>') +
        '<span class="card-num">' + num + '</span>' +
      '</div>' +
      '<h2 class="serif">' + esc(t.title) + '</h2>' +
      (t.tagline ? '<p class="tagline">' + esc(t.tagline) + '</p>' : '') +
      (t.description ? '<p class="desc">' + esc(t.description) + '</p>' : '') +
      (t.outputs && t.outputs.length ? '<ul class="outputs">' + t.outputs.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join("") + '</ul>' : '') +
      '<div class="card-foot"><span>' + esc(metaLine(t)) + '</span>' +
        (live ? '<span class="cta">Start test &rarr;</span>' : '') +
      '</div>';
    return live
      ? '<a class="card" href="' + esc(t.url) + '">' + inner + '</a>'
      : '<div class="card soon" aria-disabled="true">' + inner + '</div>';
  }

  fetch("tests.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var tests = (data && data.tests) || [];
      if (!tests.length) { list.innerHTML = '<p class="state">New tests are on the way. Check back soon.</p>'; return; }
      var order = [], groups = {};
      tests.forEach(function (t) {
        var c = t.category || "More tests";
        if (!groups[c]) { groups[c] = []; order.push(c); }
        groups[c].push(t);
      });
      var n = 0;
      list.innerHTML = order.map(function (c) {
        var items = groups[c];
        return '<section class="category"><div class="category-head"><h2>' + esc(c) + '</h2><span>' +
          items.length + (items.length === 1 ? " test" : " tests") + '</span></div>' +
          '<div class="grid">' + items.map(function (t) { return card(t, n++); }).join("") + '</div></section>';
      }).join("");
    })
    .catch(function () {
      list.innerHTML = '<p class="state">Could not load the list of tests. Please refresh the page.</p>';
    });
})();
</script>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle"), root = document.documentElement;
    function sync() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      btn.title = dark ? "Light mode" : "Dark mode";
    }
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      function apply() {
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("hv-theme", next); } catch (e) {}
        sync();
      }
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!document.startViewTransition || reduce) { apply(); return; }
      var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(apply).ready.then(function () {
        root.animate({ clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + end + "px at " + x + "px " + y + "px)"] },
          { duration: 500, easing: "cubic-bezier(.2,.7,.2,1)", pseudoElement: "::view-transition-new(root)" });
      }).catch(function () {});
    });
    sync();
  })();
</script>
</body>
</html>
